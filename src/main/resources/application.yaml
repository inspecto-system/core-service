spring:
  application:
    name: core-service
  datasource:
    # Runtime connections use the DML-only role; migrations use the owner role (SECURITY.md §6).
    url: ${CORE_DB_URL:jdbc:postgresql://127.0.0.1:5432/inspecto_core?sslmode=require}
    username: ${CORE_DB_APP_USER:core_app}
    password: ${CORE_DB_APP_PASSWORD:}
  flyway:
    # Same database as the data source, but migrations run as the owner role.
    user: ${CORE_DB_MIGRATOR_USER:core_migrator}
    password: ${CORE_DB_MIGRATOR_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${CORE_PORT:8081}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
      path-mapping:
        health: health
  endpoint:
    health:
      show-details: never
      # /health/live and /health/ready (docs/API_DOCUMENTATION.md §5)
      group:
        live:
          include: livenessState
        ready:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

inspecto:
  security:
    issuer: inspecto-core
    audience: inspecto-api
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    key-id: ${CORE_JWT_KEY_ID:core-1}
    # PKCS#8 PEM; when empty an ephemeral key is generated (development only).
    private-key: ${CORE_JWT_PRIVATE_KEY:}
    max-failed-logins: 5
    lock-duration: 15m
    cookie-secure: ${CORE_COOKIE_SECURE:true}
